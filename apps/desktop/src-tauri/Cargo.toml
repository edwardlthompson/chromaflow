[package]
name = "chromaflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ChromaFlow Tauri 2 shell (unprivileged; no PWM writes)"

[[bin]]
name = "chromaflow-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[features]
# Embed Vite dist (`tauri://` / asset.localhost). Default so plain
# `cargo build --release` is not a blank Edge "refresh" page on :1420.
# For live Vite: `cargo run -p chromaflow-desktop --no-default-features`
# (or `npm run tauri -- dev`, which passes --no-default-features).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
chromaflow-core = { path = "../../../crates/chromaflow-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["image-png", "image-ico", "tray-icon"] }
