[package]
name = "chromaflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ChromaFlow Tauri 2 shell (unprivileged; no PWM writes)"

[[bin]]
name = "chromaflow-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[features]
# Embed Vite dist (`tauri://` / asset.localhost). Required for the .deb.
# Omit for `tauri dev` so the webview can use http://127.0.0.1:1420.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
chromaflow-core = { path = "../../../crates/chromaflow-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["image-png", "image-ico", "tray-icon"] }
