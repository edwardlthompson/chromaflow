name: ChromaFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chromaflow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product:
    name: Product crates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: ShellCheck support script
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Rust fmt clippy test (CLI/core; Tauri needs WebKit)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --exclude chromaflow-desktop -- -D warnings
          cargo test --workspace --exclude chromaflow-desktop
      - name: Support dry-run
        run: |
          bash scripts/install-support.sh --dry-run
          python3 -m unittest tests.test_chromaflow_support tests.test_no_pwm_write tests.test_chromaflow_tauri
          shellcheck scripts/install-support.sh
      - name: Desktop UI build
        working-directory: apps/desktop
        run: npm ci && npm run build

  tauri-attempt:
    name: Tauri 2 compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-22.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: WebKit/GTK (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: Frontend dist
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Compile Tauri 2 GUI
        run: cargo build -p chromaflow-desktop --features custom-protocol
