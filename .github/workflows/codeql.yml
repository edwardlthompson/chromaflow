name: CodeQL

# Matrix covers present stacks (JS/TS, Python). Android is omitted when
# examples/android is pruned. Optional examples/rust and examples/go stay
# excluded — see modules/rust/MODULE.md and modules/go/MODULE.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Do not add jobs.<id>.environment — Environments block Release Please bot PRs
# (ACTION_REQUIRED) and stall auto-merge. github-pages is Pages-only.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java (Android)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        if: matrix.language == 'java-kotlin'
        run: yes | sdkmanager --licenses
      - name: Initialize CodeQL (repo-wide)
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
