[workspace]
resolver = "2"
members = [
  "crates/chromaflow-core",
  "crates/chromaflow-cli",
  "crates/chromaflow-lpc",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/chromaflow-core",
  "crates/chromaflow-cli",
  "crates/chromaflow-lpc",
]
exclude = ["examples/rust"]

[workspace.package]
version = "1.0.3"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = "2"
tauri-build = "2"
